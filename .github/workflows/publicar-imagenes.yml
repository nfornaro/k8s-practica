name: Publicar imágenes

on:
  push:
    branches: [main]
    paths:
      - app/**
      - Dockerfile
      - .github/workflows/publicar-imagenes.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: 1.0.0
            roto: "false"
          - version: 2.0.0
            roto: "false"
          - version: 3.0.0
            roto: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pedidos:${{ matrix.version }}
          build-args: |
            APP_VERSION=${{ matrix.version }}
            RELEASE_ROTO=${{ matrix.roto }}
