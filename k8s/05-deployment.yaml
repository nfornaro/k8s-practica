apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
spec:
  replicas: 4
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
        - name: pedidos
          image: ghcr.io/nfornaro/pedidos:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pedidos-config
            - secretRef:
                name: pedidos-secret
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
